name: Build RaisSky Secrets Forge 26.2 v0.1.5

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore base source
        run: |
          mkdir -p raissky-work
          curl -L --fail --retry 3 -o /tmp/raissky-source.tar.gz https://raw.githubusercontent.com/snowball3605/Test/c1b0f474d309d3849778357a16ca36bf71bb4848/raissky-build/source.tar.gz
          tar -xzf /tmp/raissky-source.tar.gz -C raissky-work
      - name: Apply v0.1.5 source overrides
        run: |
          cp raissky-v013/build.gradle raissky-work/build.gradle
          cp raissky-v013/ClientController.java raissky-work/src/main/java/dev/raistey/raisskysecrets/ClientController.java
          cp raissky-v013/Models.java raissky-work/src/main/java/dev/raistey/raisskysecrets/Models.java
          cp raissky-v013/RoomMatcher.java raissky-work/src/main/java/dev/raistey/raisskysecrets/RoomMatcher.java
          cp raissky-v013/RoomDatabase.java raissky-work/src/main/java/dev/raistey/raisskysecrets/RoomDatabase.java
          cp raissky-v013/SecretStateTracker.java raissky-work/src/main/java/dev/raistey/raisskysecrets/SecretStateTracker.java
          cp raissky-v013/RaisSkySecrets.java raissky-work/src/main/java/dev/raistey/raisskysecrets/RaisSkySecrets.java
          cp raissky-v013/mods.toml raissky-work/src/main/resources/META-INF/mods.toml
          cp raissky-v013/pack.mcmeta raissky-work/src/main/resources/pack.mcmeta
      - name: Build exact Forge 65.1.0 target
        working-directory: raissky-work
        run: gradle clean build --no-daemon --stacktrace
      - name: Verify JAR metadata and bat tracking
        working-directory: raissky-work
        run: |
          jar tf build/libs/RaisSky-Secrets-Forge-26.2-0.1.5.jar | grep -E 'META-INF/mods.toml|pack.mcmeta|SecretStateTracker.class|SecretHud.class'
          javap -classpath build/libs/RaisSky-Secrets-Forge-26.2-0.1.5.jar -c -p dev.raistey.raisskysecrets.SecretStateTracker >/tmp/tracker.javap
          grep -q 'onEntityRemoved' /tmp/tracker.javap
          grep -q 'net/minecraft/world/entity/ambient/Bat' /tmp/tracker.javap
      - uses: actions/upload-artifact@v4
        with:
          name: RaisSky-Secrets-Forge-26.2-0.1.5
          path: raissky-work/build/libs/RaisSky-Secrets-Forge-26.2-0.1.5.jar
